name: Publish source release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing installer tag (for example v1.1.2)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate and package the selected tag
        run: python3 scripts/package-source-release.py "$RELEASE_TAG"
      - name: Create a draft, upload all assets, then publish
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Use a new tag; existing assets are preserved.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Public source release; see README for installation and upgrades.'
          gh release upload "$RELEASE_TAG" release/installer.sh release/SHA256SUMS "release/remnacust-source-$RELEASE_TAG.tar.gz"
          gh release edit "$RELEASE_TAG" --draft=false --latest
