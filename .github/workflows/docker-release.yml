name: Publish Docker release
run-name: ${{ inputs.tag }}
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing installer tag (for example v1.1.5)
        required: true
permissions:
  contents: read
concurrency:
  group: docker-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      build_time: ${{ steps.metadata.outputs.build_time }}
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REMNACUST_NODE_SOURCE: ${{ github.workspace }}/node-repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Read pinned node revision
        id: node-source
        run: python3 -c 'import json,os,subprocess; lock=json.loads(subprocess.check_output(["git","show","refs/tags/"+os.environ["RELEASE_TAG"]+":component-sources.json"])); print("commit="+lock["node"]["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: lottman/Remnacust-node
          ref: ${{ steps.node-source.outputs.commit }}
          path: node-repository
      - name: Record release build time
        id: metadata
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          package-manager-cache: false
      - name: Use npm 12.2.2
        run: npm install --global --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org npm@12.2.2 && test "$(npm --version)" = "12.2.2"
      - name: Load Docker test images from public mirror
        run: |
          for image in library/alpine:3.22 library/postgres:18.4 library/postgres:18.6 library/postgres:18.7 library/node:24.22.1-trixie-slim library/nginx:1.28-alpine library/caddy:2.11.9-alpine valkey/valkey:9.1.3-alpine; do
            docker pull "mirror.gcr.io/$image"
            docker tag "mirror.gcr.io/$image" "${image#library/}"
          done
      - name: Verify panel IPv6 upgrade on real Docker
        timeout-minutes: 3
        run: python3 -B installer/tests/panel_ipv6_docker.integration.py --required
      - name: Test installer and package pinned source
        run: |
          bash -n installer/installer.sh
          sudo env "PATH=$PATH" "REMNACUST_NODE_SOURCE=$REMNACUST_NODE_SOURCE" bash tests/installer.test.sh
          sudo python3 -B installer/tests/node_https_nginx.integration.py
          bash installer/tests/database-network-docker.sh
          bash installer/tests/net-admin-docker.sh
          python3 installer/tests/image-cleanup-docker.py
          sudo python3 installer/tests/node_state_docker.integration.py
          sudo env REMNACUST_NODE_SOURCE="$REMNACUST_NODE_SOURCE" python3 installer/tests/node_policy_image_docker.integration.py
          sudo python3 installer/tests/panel_restore_docker.integration.py
          bash tests/database-repair.test.sh
          python3 tests/package-release.test.py
          python3 tests/core-catalog-package.test.py
          python3 tests/images.test.py
          python3 tests/build-metadata.test.py
          bash installer/tests/uninstall-docker.sh
          bash installer/tests/reinstall-docker.sh
          python3 scripts/package-source-release.py "$RELEASE_TAG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-input
          path: release/
          compression-level: 0
          retention-days: 3
  images:
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [panel, node, subscription-page]
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      COMPONENT: ${{ matrix.component }}
      ARCHITECTURE: ${{ matrix.architecture }}
      BUILD_TIME: ${{ needs.prepare.outputs.build_time }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-input
          path: release
      - name: Prepare exact component sources
        id: source
        run: |
          mkdir source
          tar -xzf "release/remnacust-source-$RELEASE_TAG.tar.gz" -C source
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          component=os.environ['COMPONENT'];arch=os.environ['ARCHITECTURE'];tag=os.environ['RELEASE_TAG']
          lock=json.loads(Path('source/component-sources.json').read_text())
          pin=lock['node' if component=='node' else 'panel']
          contexts={'panel':'.','node':'node','subscription-page':'subscription-page'}
          dockerfiles={'panel':'panel/Dockerfile','node':'node/docker/Dockerfile','subscription-page':'subscription-page/Dockerfile'}
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for k,v in {'core_version':lock['core']['version'],'version':pin['version'],'commit':pin['commit'],'repository':pin['repository'],'context':'source/'+contexts[component],
                          'dockerfile':'source/'+dockerfiles[component],'image':f'ghcr.io/lottman/remnacust-{component}:{pin["version"]}-{tag}-{arch}'}.items():
                  output.write(k+'='+v+'\n')
              if component == 'panel':
                  metadata = {'VERSION': pin['version'], 'GIT_BACKEND_COMMIT': pin['commit'],
                              'GIT_FRONTEND_COMMIT': pin['commit'], 'GIT_BRANCH': 'main',
                              'BUILD_TIME': os.environ['BUILD_TIME'], 'BUILD_NUMBER': os.environ['GITHUB_RUN_NUMBER']}
                  output.write('build_args<<REMNACUST_METADATA\n')
                  for key, value in metadata.items():
                      output.write('__RW_METADATA_' + key + '=' + value + '\n')
                  output.write('REMNACUST_METADATA\n')
          PY
          if [ "$COMPONENT" = node ]; then python3 source/node/docker/package-remnacust-core.py; fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build on native architecture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ steps.source.outputs.context }}
          file: ${{ steps.source.outputs.dockerfile }}
          platforms: linux/${{ matrix.architecture }}
          load: true
          provenance: false
          tags: ${{ steps.source.outputs.image }}
          build-args: ${{ steps.source.outputs.build_args }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.source.outputs.repository }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.architecture }}
      - name: Verify executable and publish exact image
        timeout-minutes: 15
        env:
          REMNACUST_TEST_POSTGRES_IMAGE: mirror.gcr.io/library/postgres:17.12-alpine3.24@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
          REMNACUST_TEST_VALKEY_IMAGE: mirror.gcr.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
          IMAGE: ${{ steps.source.outputs.image }}
          EXPECTED_VERSION: ${{ steps.source.outputs.version }}
          EXPECTED_CORE_VERSION: ${{ steps.source.outputs.core_version }}
          EXPECTED_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          if [ "$COMPONENT" = node ]; then
            version=$(docker run --rm --entrypoint /usr/local/bin/xray "$IMAGE" version)
            printf '%s\n' "$version"
            grep -F "Xray $EXPECTED_CORE_VERSION " <<< "$version"
            grep -F "Remnacust-$EXPECTED_CORE_VERSION" <<< "$version"
            grep -F 'go1.27.4 ' <<< "$version"
            default_version=$(docker run --rm --entrypoint /usr/local/bin/xray-default "$IMAGE" version)
            grep -F 'Xray 26.11.9 ' <<< "$default_version"
            grep -F 'go1.27.4 ' <<< "$default_version"
            for enabled in false true; do
              capabilities=()
              if [ "$enabled" = true ]; then capabilities=(--cap-add NET_ADMIN); fi
              docker run --rm -i --network bridge "${capabilities[@]}" --env EXPECTED_NET_ADMIN="$enabled" \
                --entrypoint node "$IMAGE" - < installer/tests/net-admin-node.cjs
            done
            bash source/scripts/test-node-startup.sh "$IMAGE"
          elif [ "$COMPONENT" = panel ]; then
            docker run --rm --env EXPECTED_VERSION="$EXPECTED_VERSION" --entrypoint node "$IMAGE" -e 'if(require("/opt/app/package.json").version!==process.env.EXPECTED_VERSION)process.exit(1)'
            python3 scripts/check-panel-build-metadata.py --image "$IMAGE" --version "$EXPECTED_VERSION" --commit "$EXPECTED_COMMIT" --branch main --build-time "$BUILD_TIME" --build-number "$GITHUB_RUN_NUMBER"
            bash scripts/check-panel-runtime.sh "$IMAGE" "$EXPECTED_VERSION"
          fi
          docker push "$IMAGE"
          python3 scripts/export-image.py --source source --component "$COMPONENT" --architecture "$ARCHITECTURE" --tag "$RELEASE_TAG" --output exported
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image-${{ matrix.component }}-${{ matrix.architecture }}
          path: exported/
          compression-level: 0
          retention-days: 3
  assemble:
    needs: images
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: source-input
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: image-*
          path: images
      - name: Validate all images and package runtime
        run: |
          mkdir source
          tar -xzf "release/remnacust-source-$RELEASE_TAG.tar.gz" -C source
          python3 scripts/package-docker-release.py --source source --images images --output release --tag "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          manifest=json.loads(Path('source/images.json').read_text());tag=os.environ['RELEASE_TAG']
          for component,entry in manifest['components'].items():
              sources=[x['registry'] for x in entry['architectures'].values()]
              subprocess.run(['docker','buildx','imagetools','create','--tag',f'ghcr.io/lottman/remnacust-{component}:{entry["version"]}-{tag}',*sources],check=True)
          PY
      - name: Verify anonymous pulls for both architectures
        run: |
          python3 - <<'PY'
          import json,os,subprocess,tempfile
          from pathlib import Path
          manifest=json.loads(Path('source/images.json').read_text())
          with tempfile.TemporaryDirectory(prefix='remnacust-anonymous-pull-') as directory:
              environment={**os.environ,'DOCKER_CONFIG':directory}
              for component,entry in manifest['components'].items():
                  for architecture,image in entry['architectures'].items():
                      subprocess.run(['docker','pull','--platform','linux/'+architecture,image['registry']],env=environment,check=True)
          PY
      - name: Verify panel and subscription page gateway together
        env:
          REMNACUST_TEST_POSTGRES_IMAGE: mirror.gcr.io/library/postgres:17.12-alpine3.24@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
          REMNACUST_TEST_VALKEY_IMAGE: mirror.gcr.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        run: |
          version=$(python3 -c 'import json;print(json.load(open("source/images.json"))["components"]["panel"]["version"])')
          panel="ghcr.io/lottman/remnacust-panel:$version-$RELEASE_TAG-amd64"
          page="ghcr.io/lottman/remnacust-subscription-page:$version-$RELEASE_TAG-amd64"
          docker pull "$panel"
          docker pull "$page"
          bash scripts/check-panel-runtime.sh "$panel" "$version" "$page"
      - name: Create draft release with verified images
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists. Use a new tag; existing assets are preserved.' >&2
            exit 1
          fi
          notes="docs/releases/${RELEASE_TAG#v}.md"
          if [ ! -f "$notes" ]; then
            echo 'Release notes for this version are required.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "${RELEASE_TAG#v}" --notes-file "$notes"
          gh release upload "$RELEASE_TAG" release/*
          echo 'Draft is complete. Verify anonymous GHCR access and publish it as latest.' >> "$GITHUB_STEP_SUMMARY"
