name: Refresh stable installer channel
on:
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: stable-installer-channel
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish the current stable release pointer
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            gh api repos/lottman/Remnacust-installer/releases/latest > "$RUNNER_TEMP/stable-release.json"
            tag=$(python3 -c 'import json,re,sys; r=json.load(open(sys.argv[1])); t=r.get("tag_name"); assert r.get("draft") is False and r.get("prerelease") is False and isinstance(t,str) and re.fullmatch(r"v[0-9]+\.[0-9]+\.[0-9]+",t); print(t)' "$RUNNER_TEMP/stable-release.json")
            git fetch --no-tags origin "refs/tags/$tag"
            git show FETCH_HEAD:VERSION > "$RUNNER_TEMP/stable-version"
            python3 scripts/release-channel.py --release-file "$RUNNER_TEMP/stable-release.json" --source-version "$RUNNER_TEMP/stable-version" --output release-channel.json
            if git diff --quiet -- release-channel.json; then exit 0; fi
            git add -- release-channel.json
            git commit -m 'Update stable installer channel [skip ci]'
            if git push origin HEAD:refs/heads/main; then exit 0; fi
          done
          exit 1
