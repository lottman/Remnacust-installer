name: Public release check
run-name: Public ${{ inputs.tag || github.event.release.tag_name }}
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Expected stable installer tag
        required: true
permissions:
  contents: read
jobs:
  anonymous-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Verify anonymous Latest download and release preflight
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          root=$(mktemp -d "$RUNNER_TEMP/remnacust-public.XXXXXXXX")
          trap '[[ "$root" == "$RUNNER_TEMP"/remnacust-public.* ]] && sudo rm -rf -- "$root"' EXIT
          unset GH_TOKEN GITHUB_TOKEN
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 10 --max-time 90 --retry 2 --max-filesize 1048576 \
            https://github.com/lottman/Remnacust-installer/releases/latest/download/installer.sh \
            --output "$root/installer.sh"
          bash -n "$root/installer.sh"
          sudo env REMNACUST_ROOT="$root/state" bash "$root/installer.sh" --check-release --version latest | tee "$root/result.log"
          grep -F -- "$EXPECTED_TAG" "$root/result.log"
  latest-images:
    needs: anonymous-installer
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    concurrency:
      group: remnacust-stable-latest-images
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - name: Promote verified stable images to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          EXPECTED_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: python3 -B scripts/promote-latest-images.py --tag "$EXPECTED_TAG" --apply
