name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bash -n installer/installer.sh && bash tests/installer.test.sh
      - run: bash tests/database-repair.test.sh
      - run: python3 tests/package-release.test.py
